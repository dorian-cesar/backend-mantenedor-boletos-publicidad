version: '3.8'

services:
  backend:
    build: .
    container_name: boletos_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./uploads:/usr/src/app/uploads
    # Dependencias como base de datos irían aquí si también las levantas con docker
    # depends_on:
    #   - db

